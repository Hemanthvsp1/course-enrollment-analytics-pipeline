[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-enrollment-analytics-pipeline"
version = "0.1.0"
description = "Python ETL and PostgreSQL analytics pipeline for course enrollment and department reporting."
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.2",
    "SQLAlchemy==2.0.31",
    "psycopg[binary]==3.2.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
